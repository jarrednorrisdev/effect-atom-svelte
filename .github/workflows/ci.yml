name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run lint
      - run: bun run build
      - run: bun run check
      - run: bun run test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            apps/demo/test-results
            apps/demo/playwright-report
            packages/effect-atom-svelte/.vitest
          retention-days: 7

  deploy:
    # Deploys the docs site to atom.jarrednorris.dev (apps/demo/alchemy.run.ts) once main passes.
    # It skips until the Cloudflare secrets exist, so adding them is what puts the site live.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::No Cloudflare secrets yet, so the docs site was not deployed."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun install --frozen-lockfile
      # The site imports the library's build.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun run --cwd packages/effect-atom-svelte build
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun run --cwd apps/demo deploy --yes --no-input

  changeset:
    # A change to the library should come with a changeset describing it for the changelog.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx changeset status --since=origin/main
