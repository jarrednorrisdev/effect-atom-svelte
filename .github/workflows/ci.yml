name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run lint
      - run: bun run build
      - run: bun run check
      - run: bun run test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            apps/demo/test-results
            apps/demo/playwright-report
            packages/effect-atom-svelte/.vitest
          retention-days: 7

  changeset:
    # A change to the library should come with a changeset describing it for the changelog.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx changeset status --since=origin/main
