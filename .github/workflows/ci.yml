name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand (Actions tab or `gh workflow run CI`) to test every engine whatever changed.
  workflow_dispatch:

# No job writes to the repository. Deploy uses Cloudflare's secrets, not the token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR replaces its old run, but every commit on main runs to the end, so each one
  # gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    # Which engines the e2e suite runs in. The hooks depend on each engine's microtask timing, so a
    # change to the library, the e2e setup, dependencies or this workflow runs all three; docs and
    # examples alone run Chromium (JND-91). A new branch, a force push or a manual run runs all
    # three.
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.engines.outputs.engines }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: engines
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          all='["chromium","firefox","webkit"]'
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}"; then
            engines=$all
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(packages/effect-atom-svelte/|apps/demo/e2e/|apps/demo/playwright\.config\.ts$|\.github/workflows/|bun\.lock$|(.*/)?package\.json$)'; then
            engines=$all
          else
            engines='["chromium"]'
          fi
          echo "engines=$engines" >> "$GITHUB_OUTPUT"
          echo "::notice::e2e engines: $engines"

  check:
    # Lint, types and the Vitest suites. The browser tests in the library run in all three engines.
    runs-on: ubuntu-latest
    # Playwright's image comes with all three browsers and their system libraries, which took up to
    # a minute and a half to install per job. Its version must match Playwright's in bun.lock; if it
    # doesn't, Playwright says so when it launches a browser. The e2e and hosted jobs reuse it.
    container: &playwright
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # The runner's user, who owns the job's HOME and workspace: Firefox won't start as root in
      # another user's HOME.
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-bun needs unzip, which the image lacks; its Node can install Bun instead, under HOME
      # as the job isn't root.
      - run: |
          npm install --global --prefix "$HOME/.local" bun@1.4.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Turbo builds the library (and not the site) first: the site's check depends on its build,
      # and so does the site's Vitest run below. The e2e jobs build the site themselves.
      - run: bun run check
      - run: bun run --cwd packages/effect-atom-svelte test
      - run: bunx vitest run
        working-directory: apps/demo
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vitest-results
          path: packages/effect-atom-svelte/.vitest
          retention-days: 7

  e2e:
    # The e2e suite, split into two jobs per engine (JND-91). It ran as one job of about 420 tests,
    # which took 19 minutes. Each job keeps Playwright's default of one worker on the two-core
    # runner: two workers per job made timing-sensitive tests miss in Firefox and WebKit. The scope
    # job picks the engines.
    needs: scope
    runs-on: ubuntu-latest
    container: *playwright
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.scope.outputs.engines) }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      # setup-bun needs unzip, which the image lacks; its Node can install Bun instead, under HOME
      # as the job isn't root.
      - run: |
          npm install --global --prefix "$HOME/.local" bun@1.4.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/effect-atom-svelte build
      - run: bunx playwright test --project=${{ matrix.engine }} --shard=${{ matrix.shard }}/2
        working-directory: apps/demo
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results-${{ matrix.engine }}-${{ matrix.shard }}
          path: |
            apps/demo/test-results
            apps/demo/playwright-report
          retention-days: 7

  hosted:
    # The site built as it is hosted (the demo API in the page), checked in Chromium.
    runs-on: ubuntu-latest
    container: *playwright
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-bun needs unzip, which the image lacks; its Node can install Bun instead, under HOME
      # as the job isn't root.
      - run: |
          npm install --global --prefix "$HOME/.local" bun@1.4.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/effect-atom-svelte build
      - run: bunx playwright test -c playwright.hosted.config.ts
        working-directory: apps/demo
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: hosted-results
          path: |
            apps/demo/test-results
            apps/demo/playwright-report
          retention-days: 7

  deploy:
    # Deploys the docs site to atom.jarrednorris.dev (apps/demo/alchemy.run.ts) once main passes.
    # It skips until the Cloudflare secrets exist, so adding them is what puts the site live.
    needs: [check, e2e, hosted]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::No Cloudflare secrets yet, so the docs site was not deployed."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v7
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun install --frozen-lockfile
      # The site imports the library's build.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun run --cwd packages/effect-atom-svelte build
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun run --cwd apps/demo deploy --yes --no-input

  changeset:
    # A change to the library should come with a changeset describing it for the changelog. The
    # Version Packages PR is skipped: it consumes the changesets, so it never has one.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx changeset status --since=origin/main

  ci-ok:
    # The one check for branch protection to require. The e2e matrix changes with the scope job, so
    # its job names do; this job's name doesn't. A skipped job (changeset outside a PR) is a pass.
    needs: [scope, check, e2e, hosted, changeset]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A required job failed or was cancelled."
          exit 1
      - run: echo "Every required job passed."
