<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* Docs-site tokens (apps/demo/src/app.css). In T3 the host injects --background etc.; opened on
     its own (GitHub Pages) the fallbacks apply, light or dark with the reader's system. */
  :root {
    --bg: var(--background, oklch(1 0 0));
    --fg: var(--foreground, oklch(0.21 0.006 285.885));
    --muted-fg: var(--muted-foreground, oklch(0.442 0.017 285.786));
    --line: var(--border, oklch(0.92 0.004 286.32));
    --soft: var(--muted, oklch(0.967 0.001 286.375));
    --code-bg: var(--code-background, oklch(0.967 0.001 286.375 / 60%));
    --brand: oklch(0.72 0.18 62);
    --brand-ink: color-mix(in oklab, var(--brand) 72%, var(--fg));
    --ok: oklch(0.68 0.15 160);
    --bad: oklch(0.63 0.22 27);
    --tint: color-mix(in oklab, var(--brand) 4%, var(--bg));
    --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --serif: "Libron", ui-serif, Georgia, serif;
    --r: 0.5rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--background, oklch(0.141 0.005 285.823));
      --fg: var(--foreground, oklch(0.985 0 0));
      --muted-fg: var(--muted-foreground, oklch(0.705 0.015 286.067));
      --line: var(--border, oklch(0.274 0.006 286.033));
      --soft: var(--muted, oklch(0.274 0.006 286.033));
      --code-bg: var(--code-background, oklch(0.21 0.006 285.885 / 60%));
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); color-scheme: light dark; }
  /* Standalone (no host theme): centre the page and give it a heading. */
  body.standalone { max-width: 800px; margin: 0 auto; padding: 32px 20px 48px; }
  .standalone-only { display: none; }
  body.standalone .standalone-only { display: block; }
  .page-title { font: 600 22px/1.3 var(--sans); margin: 0 0 4px; }
  .page-sub { color: var(--muted-fg); margin: 0 0 20px; }
  .page-sub a { color: var(--brand-ink); }
  .page-sub code { font: 12.5px var(--mono); background: var(--soft); padding: 1px 5px; border-radius: 4px; }
  body { margin: 0; font-family: var(--sans); color: var(--fg); font-size: 14px; line-height: 1.5; }

  .label {
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted-fg);
  }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button {
    font: 500 12px var(--sans); color: var(--muted-fg); background: none; border: 0;
    padding: 5px 12px; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s;
  }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

  /* rail */
  .rail { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 4px; margin-bottom: 6px; }
  .rail button {
    position: relative; height: 30px; border: 1px solid var(--line); background: var(--bg);
    border-radius: 6px; font: 500 11px var(--mono); color: var(--muted-fg); cursor: pointer;
    transition: border-color .2s, background .2s, color .2s;
  }
  .rail button:hover { border-color: var(--brand); }
  .rail button.done { background: color-mix(in oklab, var(--brand) 10%, var(--bg)); color: var(--fg); }
  .rail button.now { border-color: var(--brand); background: var(--brand); color: #1a1205; }
  .phases { display: grid; gap: 4px; margin-bottom: 16px; }
  .phases div { border-top: 2px solid var(--line); padding-top: 4px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .phases div.on { border-color: var(--brand); color: var(--fg); }

  /* stage */
  .stage { border: 1px solid var(--line); border-radius: var(--r) var(--r) 0 0; background: var(--tint); padding: 16px; }
  .diagram { display: grid; grid-template-columns: var(--cols); gap: 16px; align-items: stretch; }
  .diagram.wired { gap: 0; }
  .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .colhead { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background .3s, box-shadow .3s; }
  .col.on .dot { background: var(--brand); box-shadow: 0 0 0 4px color-mix(in oklab, var(--brand) 22%, transparent); }
  .col.on .colhead .label { color: var(--fg); }

  .node {
    border: 1px solid var(--line); background: var(--bg); border-radius: var(--r);
    padding: 9px 11px; transition: opacity .35s, transform .35s, border-color .3s, box-shadow .3s, filter .35s;
  }
  .node.hidden { opacity: 0; transform: translateY(6px) scale(.98); pointer-events: none; }
  .node.gone { opacity: .38; filter: grayscale(1); }
  .node.gone .nodehead::after { content: attr(data-gone); font: 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted-fg); margin-left: auto; }
  .node.active { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in oklab, var(--brand) 18%, transparent); }
  .nodehead { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .nodehead .label { font-size: 0.66rem; }
  .row { display: flex; align-items: center; justify-content: space-between; font-family: var(--mono); font-size: 12.5px; }
  .row code { color: var(--muted-fg); }
  .val {
    display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 26px; padding: 0 8px;
    border-radius: 6px; border: 1px solid var(--line); font: 600 14px var(--mono);
  }
  .flash { animation: flash .7s ease; }
  @keyframes flash {
    0% { transform: scale(1); }
    30% { transform: scale(1.28); background: var(--brand); color: #1a1205; border-color: var(--brand); }
    100% { transform: scale(1); }
  }
  .chip {
    font: 500 11.5px var(--mono); border: 1px dashed color-mix(in oklab, var(--brand) 60%, var(--line));
    background: color-mix(in oklab, var(--brand) 7%, var(--bg)); border-radius: 6px; padding: 6px 9px;
    transition: opacity .35s, transform .35s;
  }
  .chip.hidden { opacity: 0; transform: translateY(6px); }
  .chip .label { display: block; font-size: .62rem; margin-bottom: 2px; }
  .queue { border-style: solid; border-color: var(--bad); background: color-mix(in oklab, var(--bad) 8%, var(--bg)); }
  .queue.applied { border-color: var(--line); background: var(--bg); opacity: .45; text-decoration: line-through; }

  .htmlbox pre { margin: 0; font: 12.5px var(--mono); color: var(--muted-fg); }
  .htmlbox pre b { color: var(--fg); font-weight: 600; }

  /* wire */
  .wire { position: relative; display: flex; align-items: center; justify-content: center; }
  .wire .line { position: absolute; left: 10px; right: 10px; top: 50%; border-top: 1px dashed var(--line); }
  .wire .line::after { content: ""; position: absolute; right: -2px; top: -4px; border: 4px solid transparent; border-left: 6px solid var(--line); }
  .wire .wl { position: absolute; top: calc(50% + 8px); width: 100%; text-align: center; font-size: .58rem; }
  .packet {
    position: absolute; top: calc(50% - 15px); left: 4px; height: 30px; padding: 0 8px; border-radius: 6px;
    background: var(--brand); color: #1a1205; font: 600 11px var(--mono); display: flex; align-items: center; gap: 6px;
    opacity: 0; white-space: nowrap;
  }
  .packet.go { animation: travel 1.6s cubic-bezier(.5,0,.3,1) forwards; }
  @keyframes travel {
    0% { left: 0; opacity: 0; transform: scale(.8); }
    15% { opacity: 1; transform: scale(1); }
    85% { opacity: 1; }
    100% { left: calc(100% - 64px); opacity: 0; }
  }

  /* screen */
  .screen { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--bg); transition: border-color .3s, box-shadow .3s; }
  .screen.active { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in oklab, var(--brand) 18%, transparent); }
  .chrome { display: flex; align-items: center; gap: 5px; padding: 6px 9px; border-bottom: 1px solid var(--line); }
  .chrome i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .chrome span { margin-left: 8px; font: 10.5px var(--mono); color: var(--muted-fg); }
  .view { position: relative; height: 92px; display: flex; align-items: center; justify-content: center; }
  .big { font: 600 44px/1 var(--mono); transition: color .3s, opacity .3s; }
  .big.flip { animation: flip .5s ease; }
  @keyframes flip { 0% { transform: translateY(0); opacity: 1; } 40% { transform: translateY(-10px); opacity: 0; } 41% { transform: translateY(10px); } 100% { transform: translateY(0); opacity: 1; } }
  .view.blank .big { opacity: 0; }
  .view.static .big { color: var(--muted-fg); }
  .badge {
    position: absolute; left: 8px; right: 8px; bottom: 6px; text-align: center; font: 500 10.5px var(--mono);
    letter-spacing: .03em; color: var(--muted-fg); transition: color .3s;
  }
  .badge.bad { color: var(--bad); }
  .badge.ok { color: var(--ok); }
  .view.bad { background: color-mix(in oklab, var(--bad) 7%, var(--bg)); }
  .view.ok { background: color-mix(in oklab, var(--ok) 7%, var(--bg)); }
  .view { transition: background .4s; }

  /* code + text */
  .lower { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--r) var(--r); }
  .code { background: var(--code-bg); padding: 12px 0; border-right: 1px solid var(--line); min-width: 0; }
  .code .file { padding: 0 14px 8px; }
  .code pre { margin: 0; font: 12px/1.65 var(--mono); overflow-x: auto; }
  .code .ln { display: block; padding: 0 14px; border-left: 2px solid transparent; color: var(--muted-fg); transition: background .3s, color .3s, border-color .3s; white-space: pre; }
  .code .ln.hl { background: color-mix(in oklab, var(--brand) 14%, transparent); border-left-color: var(--brand); color: var(--fg); }
  .text { padding: 14px 16px; }
  .text h3 { margin: 0 0 6px; font: 600 15px/1.35 var(--sans); }
  .text p { margin: 0 0 8px; color: var(--fg); opacity: .88; }
  .text p code, .text h3 code { font: 12.5px var(--mono); background: var(--soft); padding: 1px 5px; border-radius: 4px; }
  .note { font-family: var(--serif); font-style: italic; color: var(--brand-ink); font-size: 15px; margin-top: 4px; }
  .fade-in { animation: fadein .35s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* controls + strip */
  .controls { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 10px; }
  .btn { white-space: nowrap;
    font: 500 13px var(--sans); color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 16px; cursor: pointer; transition: border-color .2s, opacity .2s;
  }
  .btn:hover:not(:disabled) { border-color: var(--brand); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .counter { font: 12px var(--mono); color: var(--muted-fg); }
  .strip { margin-top: 16px; border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
  .frames { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .frame {
    min-width: 44px; padding: 0 9px; height: 40px; border: 1px solid var(--line); border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font: 600 17px var(--mono); color: var(--muted-fg); opacity: .3; transition: opacity .3s, border-color .3s, background .3s, color .3s;
  }
  .frame.seen { opacity: 1; color: var(--fg); }
  .frame.seen.bad { border-color: var(--bad); background: color-mix(in oklab, var(--bad) 10%, var(--bg)); color: var(--bad); }
  .arrow { color: var(--muted-fg); font-size: 12px; opacity: .5; }
  .stripnote { margin-left: auto; font: 500 12px var(--mono); }
  .stripnote.bad { color: var(--bad); }
  .stripnote.ok { color: var(--ok); }
  .kbd { font: 11px var(--mono); color: var(--muted-fg); }

  @media (max-width: 600px) {
    .diagram { grid-template-columns: 1fr; gap: 10px; }
    /* No room to hold a place for a box that appears later. */
    .node.hidden, .chip.hidden { display: none; }
    .wire { height: 54px; }
    .lower { grid-template-columns: 1fr; }
    .code { border-right: 0; border-bottom: 1px solid var(--line); }
    .rail { grid-template-columns: repeat(min(var(--n), 6), 1fr); }
    .phases { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

  /* ?capture: just the diagram, for PR screenshots. */
  body.capture.standalone { max-width: 880px; padding: 20px; }
  body.capture .standalone-only, body.capture .controls, body.capture .kbd, body.capture .primer { display: none; }
  body.capture .strip { margin-bottom: 0; }

/* Last, so no later `font` shorthand turns them back on: JetBrains Mono draws => and <!-- as arrows. */
code, pre, .ln, .row, .chip, .val, .packet, .label { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }

/* A box marked wrong or right. Last, so it wins over the active ring's border. */
.node.tone-bad, .chip.tone-bad { border: 1px solid var(--bad); background: color-mix(in oklab, var(--bad) 9%, var(--bg)); }
.node.tone-ok, .chip.tone-ok { border: 1px solid var(--ok); background: color-mix(in oklab, var(--ok) 8%, var(--bg)); }
.tone-bad .val, .tone-bad pre b, .tone-bad .body { color: var(--bad); border-color: var(--bad); }
.tone-ok .val, .tone-ok pre b, .tone-ok .body { color: var(--ok); border-color: var(--ok); }

.big.long { font-size: 26px; }

/* Primer: the scenario and the terms, above the steps. */
.primer { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; margin-bottom: 16px; }
.primer summary { cursor: pointer; color: var(--fg); }
.primer[open] summary { margin-bottom: 10px; }
.primer .intro p { margin: 0 0 8px; }
.primer dl { margin: 12px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
.primer dt { font-weight: 600; margin-bottom: 2px; }
.primer dd { margin: 0; color: var(--fg); opacity: .88; }
.primer code, .tip code { font: 12.5px var(--mono); background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.from { font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--brand-ink);
  border: 1px solid color-mix(in oklab, var(--brand) 40%, var(--line)); border-radius: 999px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
.term { text-decoration: underline dotted color-mix(in oklab, var(--brand) 70%, var(--fg)); text-underline-offset: 3px; cursor: help; }
.term:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-radius: 2px; }
.tip { position: fixed; z-index: 10; max-width: min(340px, calc(100vw - 16px)); padding: 10px 12px; border: 1px solid var(--line);
  border-radius: var(--r); background: var(--bg); font-size: 13px; line-height: 1.45; pointer-events: none; opacity: 0; transition: opacity .15s; }
.tip.on { opacity: 1; }
.tip div { margin-top: 4px; opacity: .88; }
@media (max-width: 600px) { .primer dl { grid-template-columns: 1fr; } }

/* Graph: atoms as small boxes, with edges drawn between them. */
.graph .plot { position: relative; }
.graph .plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.graph.windowed { padding: 0; overflow: hidden; }
.graph.windowed .plot { margin: 10px 11px; }
.gn { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center;
  border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 7px; white-space: nowrap;
  transition: opacity .35s, border-color .3s, background .3s, color .3s; }
.gl { font: 500 11.5px var(--mono); }
.gv { font: 600 11px var(--mono); color: var(--brand-ink); border-radius: 4px; padding: 0 3px; }
.gv:empty { display: none; }
.gn.off { opacity: 0; }
.gn[data-mark="hl"] { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in oklab, var(--brand) 18%, transparent); }
.gn[data-mark="dim"] { opacity: .4; }
.gn[data-mark="bad"] { border-color: var(--bad); background: color-mix(in oklab, var(--bad) 10%, var(--bg)); color: var(--bad); }
.gn[data-mark="ok"] { border-color: var(--ok); background: color-mix(in oklab, var(--ok) 10%, var(--bg)); color: var(--ok); }
.edge { stroke: var(--muted-fg); stroke-width: 1.5; fill: none; }
.edge-mount { stroke-dasharray: 4 3; }
.edge-new { stroke: var(--brand); stroke-width: 2; }
.edge-gone { stroke: var(--bad); stroke-dasharray: 2 3; opacity: .6; }
.edge-bad { stroke: var(--bad); stroke-width: 2; }
.edge-ok { stroke: var(--ok); stroke-width: 2; }
.arrow-read path, .arrow-mount path { fill: var(--muted-fg); }
.arrow-gone path { fill: var(--bad); opacity: .6; }
.arrow-new path { fill: var(--brand); }
.arrow-bad path { fill: var(--bad); }
.arrow-ok path { fill: var(--ok); }
.edge.fresh { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw .6s ease forwards; }
.edge-mount.fresh { animation: none; stroke-dasharray: 4 3; stroke-dashoffset: 0; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.legend { margin-top: 6px; font: 10.5px var(--mono); color: var(--muted-fg); }
.graph.windowed .legend { margin: 0 11px 8px; }
.gn, .gl, .gv, .legend, .primer code, .tip code, .text code { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }

/* A box with lane "*": the full width, above the lanes. */
.diagram > .span { grid-column: 1 / -1; }

</style>
</head>
<body>
<script>
// The explainer engine: builds a step-through diagram page from a spec. See ../SKILL.md for the
// spec's shape and ../examples/ for a full one. Inlined into each page by ../scripts/build.mjs.
const Stepper = (() => {
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };
  // Replays a CSS animation on every call.
  const replay = (e, cls) => {
    e.classList.remove(cls);
    void e.offsetWidth;
    e.classList.add(cls);
  };
  const valueOf = (s) => (s !== null && typeof s === "object" ? s.v : s);

  /**
   * Box kinds: `make` builds the element once, `paint` shows one step's state (null only for a
   * screen). A state object's `tone` ("bad" | "ok") colours any box; render() applies it.
   */
  const KINDS = {
    // A store with one named value, such as a registry holding countAtom.
    store: {
      make: (b) => {
        const e = el("div", "node", `<div class="nodehead"><span class="label">${b.label}</span></div>
          <div class="row"><code>${esc(b.row ?? "")}</code><span class="val">·</span></div>`);
        // Read by the CSS label a gone store shows.
        e.querySelector(".nodehead").dataset.gone = b.goneLabel ?? "gone";
        return e;
      },
      paint: (e, s, b, animate) => {
        e.classList.toggle("gone", typeof s === "object" && !!s.gone);
        const val = e.querySelector(".val");
        const next = String(valueOf(s) ?? "·");
        if (val.textContent !== next) {
          val.textContent = next;
          if (animate) replay(val, "flash");
        }
      },
    },
    // Text with a value in it: `text` contains {v}, such as "<p>{v}</p>".
    text: {
      make: (b) => el("div", "node htmlbox", `<div class="nodehead"><span class="label">${b.label}</span></div><pre></pre>`),
      paint: (e, s, b) => {
        e.querySelector("pre").innerHTML = esc(b.text).replace("{v}", `<b>${esc(valueOf(s) ?? "")}</b>`);
      },
    },
    // Plain data, such as a dehydrated list. A string state replaces the box's text.
    data: {
      make: (b) => el("div", "chip", `<span class="label">${b.label}</span><span class="body"></span>`),
      paint: (e, s, b) => {
        const text = typeof s === "string" ? s : typeof s === "object" ? s.text : undefined;
        e.querySelector(".body").textContent = text ?? b.text;
      },
    },
    // Something waiting to happen. State "applied" strikes it through.
    queue: {
      make: (b) => el("div", "chip queue", `<span class="label">${b.label}</span><span class="body">${esc(b.text)}</span>`),
      paint: (e, s) => e.classList.toggle("applied", s === "applied"),
    },
    // What the user sees: { v, badge, tone: "bad" | "ok", live }. Never hidden; null shows it empty.
    screen: {
      make: (b) => el("div", "screen", `<div class="chrome"><i></i><i></i><i></i><span>${esc(b.label ?? "what the user sees")}</span></div>
        <div class="view blank"><span class="big"></span><span class="badge"></span></div>`),
      paint: (e, s, b, animate) => {
        const view = e.querySelector(".view");
        const big = e.querySelector(".big");
        const badge = e.querySelector(".badge");
        if (s == null) {
          view.className = "view blank";
          big.textContent = "";
          badge.textContent = "";
          return;
        }
        view.className = "view " + (s.live ? "live" : "static") + (s.tone ? " " + s.tone : "");
        const next = String(s.v ?? "");
        // Longer values drop to a size that fits the box.
        big.classList.toggle("long", next.length > 5);
        if (big.textContent !== next) {
          if (animate && big.textContent) {
            replay(big, "flip");
            setTimeout(() => (big.textContent = next), 180);
          } else big.textContent = next;
        }
        badge.textContent = s.badge ?? "";
        badge.className = "badge" + (s.tone ? " " + s.tone : "");
      },
    },
    // Atoms and the edges between them, such as a node and its parents. The box places `nodes`
    // ({ id, label, x, y }, x and y from 0 to 1 across the plot); a step's state is
    // { edges: [[from, to, kind]], show, mark, values }. An edge kind is "read" (solid), "mount"
    // (dashed), "new" (amber), "gone" (fading, struck), "bad" or "ok". `show` lists the visible
    // nodes (all by default), `mark` maps a node to "hl" | "bad" | "ok" | "dim", and `values` puts
    // a value under a node's name. `chrome: true` draws it as a window, for what a user sees.
    graph: {
      make: (b) => {
        const head = b.chrome
          ? `<div class="chrome"><i></i><i></i><i></i><span>${esc(b.label)}</span></div>`
          : `<div class="nodehead"><span class="label">${b.label}</span></div>`;
        const e = el("div", "node graph" + (b.chrome ? " windowed" : ""), `${head}
          <div class="plot" style="height:${b.height ?? 140}px"><svg aria-hidden="true"></svg></div>
          ${b.legend ? `<div class="legend">${b.legend}</div>` : ""}`);
        const plot = e.querySelector(".plot");
        for (const n of b.nodes) {
          const d = el("div", "gn", `<span class="gl">${esc(n.label ?? n.id)}</span><span class="gv"></span>`);
          d.dataset.id = n.id;
          d.style.left = `${n.x * 100}%`;
          d.style.top = `${n.y * 100}%`;
          plot.append(d);
        }
        e._edges = [];
        new ResizeObserver(() => drawEdges(e, false)).observe(plot);
        return e;
      },
      paint: (e, s, b, animate) => {
        const st = s ?? {};
        for (const d of e.querySelectorAll(".gn")) {
          const id = d.dataset.id;
          d.classList.toggle("off", !!st.show && !st.show.includes(id));
          d.dataset.mark = st.mark?.[id] ?? "";
          const gv = d.querySelector(".gv");
          const next = st.values?.[id] == null ? "" : String(st.values[id]);
          if (gv.textContent !== next) {
            gv.textContent = next;
            if (animate && next) replay(gv, "flash");
          }
        }
        e._edges = st.edges ?? [];
        drawEdges(e, animate);
      },
    },
  };

  // Draws a graph box's edges between its nodes as they're laid out now, from the edge of one
  // node's box to the edge of the other's. Edges that weren't there last time draw themselves in.
  const ARROWS = ["read", "mount", "new", "gone", "bad", "ok"];
  function drawEdges(e, animate) {
    const plot = e.querySelector(".plot");
    const svg = plot.querySelector("svg");
    const box = plot.getBoundingClientRect();
    if (!box.width) return;
    const at = (id) => {
      const r = plot.querySelector(`.gn[data-id="${id}"]`)?.getBoundingClientRect();
      return r && { x: r.left - box.left + r.width / 2, y: r.top - box.top + r.height / 2, w: r.width / 2 + 4, h: r.height / 2 + 4 };
    };
    // Where the line from a node's centre towards (dx, dy) leaves its box.
    const exit = (n, dx, dy) => {
      const t = Math.min(dx ? n.w / Math.abs(dx) : Infinity, dy ? n.h / Math.abs(dy) : Infinity);
      return { x: n.x + dx * t, y: n.y + dy * t };
    };
    const before = e._drawn ?? new Set();
    const now = new Set();
    let html = `<defs>${ARROWS.map((k) => `<marker id="${e.dataset.uid}-${k}" class="arrow-${k}" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" /></marker>`).join("")}</defs>`;
    for (const [from, to, kind = "read"] of e._edges) {
      const a = at(from);
      const b = at(to);
      if (!a || !b) continue;
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const p = exit(a, dx, dy);
      const q = exit(b, -dx, -dy);
      const key = `${from}>${to}>${kind}`;
      now.add(key);
      const fresh = animate && !before.has(key) ? " fresh" : "";
      html += `<line class="edge edge-${kind}${fresh}" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"
        marker-end="url(#${e.dataset.uid}-${kind})" />`;
    }
    svg.innerHTML = html;
    e._drawn = now;
  }

  // Terms from the spec's primer, written {{id}} or {{id|shown text}} in any step's HTML: shown
  // underlined, with the term's definition on hover or focus.
  let terms = {};
  const withTerms = (html) =>
    String(html ?? "").replace(/\{\{(\w+)(?:\|([^}]+))?\}\}/g, (m, id, shown) =>
      terms[id] ? `<span class="term" tabindex="0" data-term="${id}">${shown ?? terms[id].term}</span>` : shown ?? id);

  function mount(spec, extraKinds = {}) {
    // A spec's own box kinds (see scripts/build.mjs), for a picture the built-in kinds can't draw.
    Object.assign(KINDS, extraKinds);
    const { meta, lanes, boxes, files, steps: tracks, primer } = spec;
    terms = Object.fromEntries((primer?.terms ?? []).map((t) => [t.id, t]));
    const after = tracks.after ?? [];
    const hasAfter = after.length > 0;
    const laneById = Object.fromEntries(lanes.map((l) => [l.id, l]));
    let mode = "before";
    let i = 0;
    let painted = false;

    // Each step's full state: box states carry over from the step before unless the step sets
    // them; `null` hides a box.
    const steps = () => {
      let state = Object.fromEntries(boxes.map((b) => [b.id, b.start ?? null]));
      return tracks.shared.concat(mode === "before" ? tracks.before : after).map((s) => {
        state = { ...state, ...s.set };
        return { ...s, state };
      });
    };

    // Page skeleton.
    document.title = meta.title;
    const body = document.body;
    body.innerHTML = `
      <div class="standalone-only"><h1 class="page-title"></h1><p class="page-sub"></p></div>
      <details class="primer" open><summary class="label"></summary><div class="intro"></div><dl></dl></details>
      <div class="top"><span class="label kicker"></span>
        <div class="seg" role="group" aria-label="Version"><button data-mode="before"></button><button data-mode="after"></button></div></div>
      <div class="rail"></div><div class="phases"></div>
      <div class="stage"><div class="diagram"></div></div>
      <div class="lower"><div class="code"><div class="file label"></div><pre class="src"></pre></div><div class="text"></div></div>
      <div class="controls"><button class="btn prev">← Back</button><span class="counter"></span><button class="btn primary next">Next →</button></div>
      <div class="strip"><span class="label strip-label"></span><div class="frames"></div></div>
      <p class="kbd">Use ← and → to step, or click a step number. Each step has its own link: the address bar follows along.</p>`;
    const q = (sel) => body.querySelector(sel);
    q(".page-title").textContent = meta.title;
    q(".page-sub").innerHTML = meta.subtitle ?? "";
    q(".kicker").textContent = meta.kicker ?? "";
    q(".strip-label").textContent = meta.stripLabel ?? "";
    const [bBefore, bAfter] = body.querySelectorAll(".seg button");
    bBefore.textContent = meta.beforeLabel ?? "Before the fix";
    bAfter.textContent = meta.afterLabel ?? "After the fix";
    if (!hasAfter) q(".seg").style.display = "none";

    // The primer: the scenario in prose, then each term the steps use, before the first step.
    if (primer) {
      q(".primer summary").textContent = primer.title ?? "Before you start";
      q(".primer .intro").innerHTML = [].concat(primer.intro ?? []).map((p) => `<p>${withTerms(p)}</p>`).join("");
      q(".primer dl").innerHTML = (primer.terms ?? [])
        .map((t) => `<div><dt>${t.term}${t.from ? ` <span class="from">${esc(t.from)}</span>` : ""}</dt><dd>${withTerms(t.html)}</dd></div>`)
        .join("");
    } else q(".primer").remove();
    const tip = el("div", "tip");
    tip.setAttribute("role", "tooltip");
    body.append(tip);
    const showTip = (ev) => {
      const t = ev.target.closest?.(".term");
      if (!t) return;
      const def = terms[t.dataset.term];
      tip.innerHTML = `<b>${def.term}</b>${def.from ? ` <span class="from">${esc(def.from)}</span>` : ""}<div>${withTerms(def.html)}</div>`;
      tip.classList.add("on");
      const r = t.getBoundingClientRect();
      const w = tip.offsetWidth;
      tip.style.left = `${Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2))}px`;
      const below = r.bottom + 8 + tip.offsetHeight < innerHeight;
      tip.style.top = `${below ? r.bottom + 8 : r.top - 8 - tip.offsetHeight}px`;
    };
    const hideTip = (ev) => ev.target.closest?.(".term") && tip.classList.remove("on");
    body.addEventListener("mouseover", showTip);
    body.addEventListener("focusin", showTip);
    body.addEventListener("mouseout", hideTip);
    body.addEventListener("focusout", hideTip);
    addEventListener("scroll", () => tip.classList.remove("on"), { passive: true });

    // Lanes and their boxes, with a wire between exactly two lanes if the spec has one.
    const diagram = q(".diagram");
    const wired = spec.wire && lanes.length === 2;
    diagram.classList.toggle("wired", !!wired);
    diagram.style.setProperty("--cols", wired ? "1fr 92px 1fr" : `repeat(${lanes.length}, 1fr)`);
    const boxEls = {};
    // A box with lane "*" spans every lane, in a row above them: for a picture that needs the
    // page's width, such as a timeline.
    for (const b of boxes.filter((x) => x.lane === "*")) {
      const e = KINDS[b.kind].make(b);
      e.dataset.uid = `box-${b.id}`;
      e.classList.add("span");
      boxEls[b.id] = e;
      diagram.append(e);
    }
    lanes.forEach((lane, n) => {
      if (wired && n === 1) {
        diagram.append(el("div", "wire", `<div class="line"></div><span class="label wl">${esc(spec.wire.label ?? "")}</span>
          <div class="packet">${esc(spec.wire.packet ?? "")}</div>`));
      }
      const col = el("div", "col", `<div class="colhead"><span class="dot"></span><span class="label">${esc(lane.label)}</span></div>`);
      col.dataset.side = lane.id;
      for (const b of boxes.filter((x) => x.lane === lane.id)) {
        const e = KINDS[b.kind].make(b);
        e.dataset.uid = `box-${b.id}`;
        boxEls[b.id] = e;
        col.append(e);
      }
      diagram.append(col);
    });

    function buildRail() {
      const all = steps();
      const rail = q(".rail");
      rail.style.setProperty("--n", all.length);
      rail.innerHTML = "";
      all.forEach((_, n) => {
        const b = el("button", "", String(n + 1));
        b.title = `Step ${n + 1}`;
        b.onclick = () => go(n);
        rail.append(b);
      });
      // One phase per run of steps in the same lane.
      const runs = [];
      all.forEach((s, n) => {
        const last = runs[runs.length - 1];
        if (last && last.side === s.side) last.end = n;
        else runs.push({ side: s.side, start: n, end: n });
      });
      const ph = q(".phases");
      ph.innerHTML = "";
      // The same columns as the rail, so each phase sits under its own steps. A label too long for
      // a short run is cut off, with the whole of it on hover.
      ph.style.gridTemplateColumns = `repeat(${all.length}, minmax(0, 1fr))`;
      for (const r of runs) {
        const name = laneById[r.side].phase ?? laneById[r.side].label;
        const span = r.start === r.end ? `step ${r.start + 1}` : `steps ${r.start + 1}–${r.end + 1}`;
        const d = el("div", "label", esc(name));
        d.title = `${name} · ${span}`;
        d.style.gridColumn = `${r.start + 1} / span ${r.end - r.start + 1}`;
        d.dataset.start = r.start;
        d.dataset.end = r.end;
        ph.append(d);
      }
    }

    function render() {
      const all = steps();
      const s = all[i];
      const last = all.length - 1;
      [...q(".rail").children].forEach((b, n) => (b.className = n === i ? "now" : n < i ? "done" : ""));
      [...q(".phases").children].forEach((d) => d.classList.toggle("on", i >= +d.dataset.start && i <= +d.dataset.end));
      body.querySelectorAll(".col").forEach((c) => c.classList.toggle("on", c.dataset.side === s.side));

      for (const b of boxes) {
        const e = boxEls[b.id];
        const st = s.state[b.id];
        // A box this mode never shows takes no room; one that appears later keeps its place.
        e.style.display = b.kind !== "screen" && all.every((x) => x.state[b.id] == null) ? "none" : "";
        const hidden = st == null && b.kind !== "screen";
        e.classList.toggle("hidden", hidden);
        e.classList.toggle("active", (s.active ?? []).includes(b.id));
        // Any box but the screen (which has its own) can be marked wrong or right: { …, tone }.
        const tone = b.kind !== "screen" && st !== null && typeof st === "object" ? st.tone : undefined;
        e.classList.toggle("tone-bad", tone === "bad");
        e.classList.toggle("tone-ok", tone === "ok");
        if (!hidden) KINDS[b.kind].paint(e, st, b, painted);
      }
      const packet = q(".packet");
      if (packet) {
        packet.classList.remove("go");
        if (s.packet) replay(packet, "go");
      }

      const f = files[s.file];
      q(".file").textContent = f.name;
      q(".src").innerHTML = f.lines
        .map((l, n) => `<span class="ln${(s.hl ?? []).includes(n) ? " hl" : ""}">${esc(l) || " "}</span>`)
        .join("");
      const t = q(".text");
      // `body` is one paragraph or a list of them.
      const paras = [].concat(s.body ?? []).map((p) => `<p>${withTerms(p)}</p>`).join("");
      t.innerHTML = `<span class="label">Step ${i + 1} of ${all.length}</span><h3>${withTerms(s.title)}</h3>${paras}${s.note ? `<p class="note">${withTerms(s.note)}</p>` : ""}`;
      replay(t, "fade-in");

      // The strip: one frame per step that sets `frame`.
      const framed = all.map((st, n) => ({ st, n })).filter(({ st }) => st.frame !== undefined);
      q(".strip").style.display = framed.length ? "" : "none";
      const frames = q(".frames");
      frames.innerHTML = "";
      framed.forEach(({ st, n }, k) => {
        if (k) frames.append(el("span", "arrow", "→"));
        const seen = i >= n;
        const d = el("div", "frame" + (seen ? " seen" : "") + (seen && st.bad ? " bad" : ""), esc(st.frame));
        d.title = `Step ${n + 1}`;
        frames.append(d);
      });
      const verdict = i === last && meta.verdict?.[mode];
      frames.append(el("span", "stripnote" + (verdict ? " " + verdict.tone : ""), verdict ? esc(verdict.text) : ""));

      q(".counter").textContent = `${i + 1} / ${all.length} · ${(laneById[s.side].phase ?? laneById[s.side].label).toLowerCase()}`;
      q(".prev").disabled = i === 0;
      q(".next").textContent =
        i === last ? (hasAfter && mode === "before" ? "See it with the fix →" : "Start over ↺") : "Next →";
      history.replaceState(null, "", `${location.search}#${mode}-${i + 1}`);
      painted = true;
    }

    const count = () => steps().length;
    function go(n) {
      i = Math.max(0, Math.min(count() - 1, n));
      render();
    }
    function setMode(m) {
      mode = hasAfter ? m : "before";
      bBefore.setAttribute("aria-pressed", mode === "before");
      bAfter.setAttribute("aria-pressed", mode === "after");
      buildRail();
      i = Math.min(i, count() - 1);
      render();
    }
    q(".prev").onclick = () => go(i - 1);
    q(".next").onclick = () => {
      if (i === count() - 1) {
        if (hasAfter && mode === "before") {
          setMode("after");
          go(tracks.shared.length);
        } else {
          setMode("before");
          go(0);
        }
      } else go(i + 1);
    };
    bBefore.onclick = () => setMode("before");
    bAfter.onclick = () => setMode("after");
    addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") q(".next").click();
      if (e.key === "ArrowLeft") go(i - 1);
    });

    // Standalone (GitHub Pages): no host theme, so centre the page and show its title. Checked
    // again after load, in case a host injects its theme late.
    const checkHost = () =>
      body.classList.toggle("standalone", !getComputedStyle(document.documentElement).getPropertyValue("--background").trim());
    checkHost();
    addEventListener("load", checkHost);
    setTimeout(checkHost, 500);
    body.classList.toggle("capture", new URLSearchParams(location.search).has("capture"));

    // Links such as #before-10 or #after-9 open on that step.
    const linked = /^#(before|after)-(\d+)$/.exec(location.hash);
    if (linked) {
      mode = linked[1];
      i = +linked[2] - 1;
    }
    setMode(mode);
    // For scripts/shoot.mjs.
    window.stepper = { count, hasAfter };
  }

  return { mount };
})();

</script>
<script>
Stepper.mount({
  "meta": {
    "title": "Fix E: the timeline's filter picks the wrong atom after a registry switch",
    "subtitle": "Filtering the devtools timeline, then switching registries, step by step. From <a href=\"https://github.com/jarrednorrisdev/effect-atom-svelte/pull/37\">#37<\/a>.",
    "kicker": "Fix E · one filter, two registries",
    "stripLabel": "Whose rows the timeline shows",
    "verdict": {
      "before": {
        "tone": "bad",
        "text": "filters to an atom nobody picked"
      },
      "after": {
        "tone": "ok",
        "text": "filter dropped, all rows shown"
      }
    }
  },
  "primer": {
    "title": "Before you start: the app, and the pieces involved",
    "intro": [
      "Picture a shop built with this library. The page layout holds the shopper's atoms, <code>userAtom<\/code> and <code>cartAtom<\/code>. In the corner sits a support chat widget that wraps itself in its own <code>RegistryProvider<\/code>, so its atoms, <code>chatAtom<\/code> and <code>draftAtom<\/code>, live apart from the page's. That's a common way to keep a self-contained widget from sharing state with the app around it.",
      "The developer has the devtools panel open on its Timeline tab, which lists what happened to each atom. They click <code>cartAtom<\/code> to see only its rows, then use the panel's picker to look at the chat widget's registry instead.",
      "<b>The bug:<\/b> after the switch, the timeline says it's showing only <code>draftAtom<\/code>, an atom the developer never picked. The filter had remembered a number, and in the new registry that number belongs to someone else."
    ],
    "terms": [
      {
        "id": "registry",
        "term": "Registry",
        "from": "Effect",
        "html": "Effect's store of atom values: it holds each atom in use and runs derived atoms when what they read changes. An app can have more than one."
      },
      {
        "id": "provider",
        "term": "<code>RegistryProvider<\/code>",
        "from": "this library",
        "html": "A Svelte component that makes a registry for the components inside it. Two providers, side by side or nested, mean two separate registries."
      },
      {
        "id": "picker",
        "term": "The panel and its picker",
        "from": "this library's devtools",
        "html": "<code>&lt;AtomDevtools /&gt;<\/code> shows one registry at a time. When the page has several, a picker at the top switches between them."
      },
      {
        "id": "model",
        "term": "Model and its numbers",
        "from": "this library's devtools",
        "html": "The panel's record of one registry: every atom it has seen and what happened to it. It gives each atom a number the first time it sees it, counting from 0, and the panel's views name atoms by that number. The panel builds a <em>new<\/em> model, counting from 0 again, every time the picker changes."
      },
      {
        "id": "timeline",
        "term": "Timeline and its filter",
        "from": "this library's devtools",
        "html": "The Timeline tab lists events (an atom built, updated, removed) as rows. Clicking an atom's name in a row narrows the list to that atom's rows and shows a chip, <code>only cartAtom ✕<\/code>, that clears the filter."
      },
      {
        "id": "state",
        "term": "<code>$props<\/code> and <code>$state<\/code>",
        "from": "Svelte",
        "html": "<code>$props()<\/code> is what a component's parent passes in; <code>$state<\/code> is the component's own value. When a prop changes, the component re-renders with the new prop, but its <code>$state<\/code> keeps whatever it held."
      },
      {
        "id": "derived",
        "term": "<code>$derived<\/code>",
        "from": "Svelte",
        "html": "A value worked out from others, and worked out again whenever they change, like a spreadsheet formula. It holds nothing of its own."
      },
      {
        "id": "effect",
        "term": "<code>$effect<\/code>",
        "from": "Svelte",
        "html": "Runs a function after the component renders, and again whenever a value it read changes. Here it reads the picker's choice, so it runs on each switch."
      }
    ]
  },
  "lanes": [
    {
      "id": "A",
      "label": "The app",
      "phase": "In the app"
    },
    {
      "id": "P",
      "label": "Devtools panel",
      "phase": "In the panel"
    }
  ],
  "boxes": [
    {
      "id": "reg1",
      "lane": "A",
      "kind": "data",
      "label": "registry 1 · the layout's",
      "text": "userAtom, cartAtom"
    },
    {
      "id": "reg2",
      "lane": "A",
      "kind": "data",
      "label": "registry 2 · the chat widget's",
      "text": "chatAtom, draftAtom"
    },
    {
      "id": "points",
      "lane": "P",
      "kind": "graph",
      "label": "the timeline's filter · and the atom it points at",
      "height": 170,
      "nodes": [
        {
          "id": "filter",
          "label": "filter",
          "x": 0.5,
          "y": 0.5
        },
        {
          "id": "user1",
          "label": "userAtom",
          "x": 0.17,
          "y": 0.18
        },
        {
          "id": "cart1",
          "label": "cartAtom",
          "x": 0.17,
          "y": 0.82
        },
        {
          "id": "chat2",
          "label": "chatAtom",
          "x": 0.83,
          "y": 0.18
        },
        {
          "id": "draft2",
          "label": "draftAtom",
          "x": 0.83,
          "y": 0.82
        }
      ],
      "legend": "left: model 1 · right: model 2 · arrow: the atom the filter shows"
    },
    {
      "id": "screen",
      "lane": "P",
      "kind": "screen",
      "label": "timeline · rows shown"
    }
  ],
  "files": {
    "app": {
      "name": "the app · two RegistryProviders",
      "lines": [
        "<!-- +layout.svelte -->",
        "<RegistryProvider>",
        "  {@render children()}",
        "<\/RegistryProvider>",
        "",
        "<!-- ChatWidget.svelte: its own registry -->",
        "<RegistryProvider>",
        "  <ChatBox />",
        "<\/RegistryProvider>"
      ]
    },
    "model": {
      "name": "internal/model.svelte.ts · simplified",
      "lines": [
        "class Model {",
        "  #nextId = 0;",
        "",
