<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <!-- An interim mark, until the site has a look of its own. -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <!-- Applies the theme before first paint; see src/lib/docs/theme.ts. <html> starts dark, the
         default. The choice is stored as JSON, such as "light" with its quotes. -->
    <script>
      try {
        const stored = localStorage.getItem("theme")?.replaceAll('"', "");
        const choice = ["dark", "light", "system"].includes(stored)
          ? stored
          : "dark";
        const dark =
          choice === "dark" ||
          (choice === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = choice;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
    <!-- Shows the header's sound icon as on before first paint; see src/lib/docs/sound-preference.ts. -->
    <script>
      try {
        if (localStorage.getItem("sound") === "on") {
          document.documentElement.dataset.sound = "on";
        }
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
